[project]
name = "security-watch-agent"
version = "0.1.0"
description = "Focused Security Watch agent built on the Mistral Agents SDK"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-agents==1.1.3",
    "pydantic>=2.13.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that must never run without explicit opt-in",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["security_watch"]
