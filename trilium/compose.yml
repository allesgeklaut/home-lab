services:
  trilium:
    #    image: zadam/trilium:latest
    image: triliumnext/trilium:latest
    container_name: trilium
    restart: unless-stopped
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
    volumes:
      - /opt/stacks/trilium/data:/home/node/trilium-data
    ports:
      - "127.0.0.1:9910:8080"
      # Preserve LAN MCP clients without listening on every IPv4/IPv6 interface.
      - "${LAN_IP:?Set LAN_IP in trilium/.env}:9910:8080"
