services:
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    user: "1000:1000"
    ports:
      - 4533:4533
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
    volumes:
      - /opt/stacks/navidrome/data:/data
      - /mnt/nas/music/Music:/music:ro
