services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_HOST_IP}:4000:4000"
    env_file:
      - /opt/secrets/litellm.env
      - /opt/secrets/portainer.env
    environment:
      - STORE_MODEL_IN_DB=False
      - TZ=Europe/Vienna
      # Portainer API base URL (not secret, paired with portainer.env creds)
      - PORTAINER_URL=https://192.168.0.46:9443
      # Idle-manager config
      - LLAMA_CONTAINER=llama-server
      - LLAMA_HEALTH_URL=http://192.168.0.46:8084/health
      - IDLE_TIMEOUT=900
      - BOOT_TIMEOUT=90
    volumes:
      - /opt/stacks/litellm/config.yaml:/app/config.yaml:ro
      - /opt/stacks/litellm/custom_callbacks.py:/app/custom_callbacks.py:ro
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"