services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports:
      # LAN binding: consumed by OpenWebUI (container) and other devices.
      # Loopback binding: consumed by opencode on this host (opencode.json
      # baseURL http://127.0.0.1:4000/v1).
      - "${LITELLM_HOST_IP}:4000:4000"
      - "127.0.0.1:4000:4000"
    env_file:
      - /opt/secrets/litellm.env
      - /opt/secrets/portainer.env
    environment:
      - STORE_MODEL_IN_DB=False
      - TZ=Europe/Vienna
      # Portainer API base URL (not secret, paired with portainer.env creds)
      - PORTAINER_URL=https://${LAN_IP}:9443
      # Idle-manager config: model name -> container + health endpoint.
      # Only one of these containers may run at a time (single 16 GB GPU).
      # boot_timeout can be overridden per model.
      # "aliases" are the upstream model ids litellm reports in the
      # success/failure hooks (provider prefix stripped, i.e. the llama.cpp
      # --alias values) so the idle timer is touched for the right container.
      - >-
        MODEL_CONTAINERS={"qwen3.8-27b":{"container":"llama-server","health":"http://${LAN_IP}:8084/health","boot_timeout":90,"aliases":["qwen3.8:27b"]},"qwen3.5-9b":{"container":"llama-companion","health":"http://${LAN_IP}:8086/health","boot_timeout":120,"aliases":["qwen3.5:9b"]}}
      - IDLE_TIMEOUT=900
      # Non-llama GPU tenants stopped before a managed model cold-starts:
      # comfyui shares the same 16 GB card (see comfyui-proxy below).
      - EXTRA_GPU_CONTAINERS=comfyui
      # OpenCode Go models (user-facing names). The OpenCodeGoSessionHeader
      # callback adds the mandatory x-opencode-session header for these.
      - >-
        OPENCODE_GO_MODELS=glm-5.3-flash,glm-5.3,gpt-5.6-luna,kimi-k3,mimo-v2.5,qwen3.8-max,qwen3.8-flash,deepseek-v4.1-flash,deepseek-v4-pro
      # Shared entrypoint wrapper: reads the master key from the mounted
      # key file and exports it as LITELLM_MASTER_KEY.
      - APP_KEY_FILE=/run/secrets/litellm.key
      - APP_KEY_ENV=LITELLM_MASTER_KEY
    volumes:
      - /opt/stacks/litellm/config.yaml:/app/config.yaml:ro
      - /opt/stacks/litellm/custom_callbacks.py:/app/custom_callbacks.py:ro
      # Portainer start/stop/health helpers, shared with comfyui-proxy.
      - /opt/stacks/litellm/gpu_containers.py:/app/gpu_containers.py:ro
      # Single source of truth for the master key — /opt/secrets/litellm.key.
      # The shared entrypoint wrapper (/opt/stacks/entrypoint.sh) exports it
      # as LITELLM_MASTER_KEY, so the key is not duplicated into any env file.
      - /opt/secrets/litellm.key:/run/secrets/litellm.key:ro
      - /opt/stacks/entrypoint.sh:/run/entrypoint.sh:ro
    # Wrap prod_entrypoint.sh with the shared key wrapper. Fails closed if
    # the key file is missing so the proxy never starts with an empty key.
    entrypoint:
      - /bin/sh
      - /run/entrypoint.sh
    command:
      - /app/docker/prod_entrypoint.sh
      - --config
      - /app/config.yaml
      - --port
      - "4000"

  # ComfyUI lifecycle proxy. Open WebUI's ComfyUI engine points here instead of
  # at ComfyUI directly: mutating requests wake the comfyui container on demand
  # and it is stopped after IDLE_TIMEOUT, mirroring the llama.cpp idle manager.
  # /object_info is answered from a cache so listing models (and Verify URL) in
  # Open WebUI never starts the GPU. Only one GPU tenant runs at a time.
  comfyui-proxy:
    build: ./comfyui_proxy
    image: comfyui-proxy:local
    container_name: comfyui-proxy
    restart: unless-stopped
    env_file:
      - /opt/secrets/portainer.env
    environment:
      - TZ=Europe/Vienna
      - PORT=8189
      - COMFYUI_CONTAINER=comfyui
      - COMFYUI_UPSTREAM=http://${LAN_IP}:8188
      - COMFYUI_HEALTH=http://${LAN_IP}:8188/system_stats
      # GPU tenants to stop before starting ComfyUI. ollama is cloud-only and
      # never holds the GPU, so it is not listed.
      - GPU_CONTAINERS=llama-server,llama-companion
      - IDLE_TIMEOUT=${COMFYUI_IDLE_TIMEOUT:-900}
      - BOOT_TIMEOUT=${COMFYUI_BOOT_TIMEOUT:-90}
      - PORTAINER_URL=https://${LAN_IP}:9443
    ports:
      # LAN binding: consumed by OpenWebUI (container).
      # Loopback binding: consumed by host tools (opencode's comfyui MCP
      # server), so they need no LAN IP in tracked config.
      - "${LAN_IP}:8189:8189"
      - "127.0.0.1:8189:8189"
    volumes:
      # Single source of truth with the litellm idle manager.
      - /opt/stacks/litellm/gpu_containers.py:/app/gpu_containers.py:ro