services:
  litellm:
    # Pinned to a release so unattended upstream changes can't break the wrapper.
    # Bumps come as deliberate Dependabot PRs; Watchtower skips pinned tags.
    image: ghcr.io/berriai/litellm:v1.106.4
    container_name: litellm
    restart: unless-stopped
    ports:
      # LAN binding: consumed by OpenWebUI (container) and other devices.
      # Loopback binding: consumed by opencode on this host (opencode.json
      # baseURL http://127.0.0.1:4000/v1).
      - "${LITELLM_HOST_IP}:4000:4000"
      - "127.0.0.1:4000:4000"
    env_file:
      - /opt/secrets/litellm.env
      - /opt/secrets/mistral.env
      # Strata's service key, as API_KEY: the same file the strata container
      # loads, so litellm's upstream auth and the idle manager's metrics probe
      # read one value. Not a second copy in litellm.env.
      # Hazard: later env_file entries win, and lifecycle-litellm.env is listed
      # after this one — an API_KEY defined there would shadow this value and
      # silently break both the route and the metrics probe. Use another name
      # there if that file ever needs a key.
      - /opt/secrets/strata.env
      - /opt/secrets/lifecycle-litellm.env
    environment:
      - STORE_MODEL_IN_DB=False
      - TZ=Europe/Vienna
      # Responses-API models (gpt-*-luna) bridge chat/completions -> /responses.
      # Request reasoning summaries so the bridge can populate reasoning_content;
      # without this luna models think but OpenWebUI shows no reasoning.
      - LITELLM_REASONING_AUTO_SUMMARY=true
      # ChatGPT subscription OAuth tokens (not an OpenAI API key).
      - CHATGPT_TOKEN_DIR=/run/secrets/chatgpt
      # Narrow gateway credential, never the Portainer administrator token.
      - LIFECYCLE_URL=https://lifecycle-gateway:8443
      - LIFECYCLE_ENV_ID=3
      - LIFECYCLE_CA_FILE=/run/secrets/lifecycle-server.pem
      # Idle-manager config: model name -> container + health endpoint.
      # Only one of these containers may run at a time (single 16 GB GPU).
      # boot_timeout can be overridden per model.
      # "aliases" are the upstream model ids litellm reports in the
      # success/failure hooks (provider prefix stripped, i.e. the llama.cpp
      # --alias values) so the idle timer is touched for the right container.
      - >-
        MODEL_CONTAINERS={"qwen3.8-27b":{"container":"llama-server","health":"http://${LAN_IP}:8084/health","boot_timeout":90,"aliases":["qwen3.8:27b"]},"qwen3.8-27b-abliterated":{"container":"llama-companion","health":"http://${LAN_IP}:8086/health","boot_timeout":120,"aliases":["qwen3.8:27b-abliterated"]},"inkling-2-mini":{"container":"llama-bolt","health":"http://${LAN_IP}:8085/health","boot_timeout":120,"aliases":["inkling-2-mini"]},"qwen3.8-flash-next":{"container":"strata","health":"http://${LAN_IP}:8090/health","metrics":"http://${LAN_IP}:8090/metrics?format=prometheus","metrics_key_env":"API_KEY","boot_timeout":600,"aliases":["qwen3.8-flash-next-iq3_s"]},"inkling-2-mini-strata":{"container":"strata-inkling","health":"http://${LAN_IP}:8091/health","metrics":"http://${LAN_IP}:8091/metrics?format=prometheus","metrics_key_env":"API_KEY","boot_timeout":1200,"aliases":["inkling-2-mini-sq15"]}}
      # Base URL for llama-bolt; kept in compose (not the secrets env) since it
      # carries no secret. The Qwen bases live in /opt/secrets/litellm.env.
      - LLAMA_BOLT_API_BASE=http://${LAN_IP}:8085/v1
      # Strata's OpenAI-compatible base (stack /opt/stacks/strata, port 8090).
      - STRATA_API_BASE=http://${LAN_IP}:8090/v1
      # The second Strata tenant, Inkling-2-Mini on the same stack (port 8091).
      # Same key, same metric dialect; only the pack and the context differ.
      - STRATA_INKLING_API_BASE=http://${LAN_IP}:8091/v1
      #
      # The strata entry above joins the same GPU group as the llama.cpp slots:
      # a cold start stops the others (and comfyui via EXTRA_GPU_CONTAINERS) and
      # is stopped when they start. Its three non-obvious fields:
      #  - metrics: Strata serves vLLM's gauge names (num_requests_running /
      #    num_requests_waiting), which the watcher parses as a second family;
      #    ?format=prometheus selects the Prometheus text body, because the
      #    bare /metrics answers the JSON the Strata web monitor uses.
      #  - metrics_key_env: /metrics is not anonymous; it takes the service key,
      #    which is already in this container's env as API_KEY
      #    (/opt/secrets/strata.env), so the probe sends it as a bearer token.
      #  - boot_timeout 600: a first start *without* MODEL_PATH downloads the
      #    pack (tens of GB); with pre-downloaded files it only prepares, and
      #    every later start re-reads ~55 GB of experts from the SSD.
      - IDLE_TIMEOUT=900
      # Startup-adopts running containers so idle timers survive a proxy restart.
      - LITELLM_WORKER_STARTUP_HOOKS=custom_callbacks:start_idle_watcher
      # Non-llama GPU tenants stopped before a managed model cold-starts:
      # comfyui shares the same 16 GB card (see comfyui-proxy below).
      - EXTRA_GPU_CONTAINERS=comfyui
      # OpenCode Go models (user-facing names). The OpenCodeGoSessionHeader
      # callback adds the mandatory x-opencode-session header and a fixed
      # User-Agent for these.
      - >-
        OPENCODE_GO_MODELS=glm-5.3-flash,glm-5.3,gpt-5.6-luna,gpt-6-luna,muse-spark-1.3-contributor,kimi-k3,kimi-k2.7-code,mimo-v2.6-flash,mimo-v2.6-pro,qwen3.8-max,qwen3.8-flash,deepseek-v4.1-flash,deepseek-v4-pro,claude-haiku-5-5
      # Shared entrypoint wrapper: reads the master key from the mounted
      # key file and exports it as LITELLM_MASTER_KEY.
      - APP_KEY_FILE=/run/secrets/litellm.key
      - APP_KEY_ENV=LITELLM_MASTER_KEY
    volumes:
      - /opt/stacks/litellm/config.yaml:/app/config.yaml:ro
      - /opt/stacks/litellm/custom_callbacks.py:/app/custom_callbacks.py:ro
      # Portainer start/stop/health helpers, shared with comfyui-proxy.
      - /opt/stacks/litellm/gpu_containers.py:/app/gpu_containers.py:ro
      - /opt/secrets/lifecycle-server.pem:/run/secrets/lifecycle-server.pem:ro
      # Single source of truth for the master key — /opt/secrets/litellm.key.
      # The shared entrypoint wrapper (/opt/stacks/entrypoint.sh) exports it
      # as LITELLM_MASTER_KEY, so the key is not duplicated into any env file.
      - /opt/secrets/litellm.key:/run/secrets/litellm.key:ro
      # Writable: OAuth refresh rotates and persists the tokens here.
      - /opt/secrets/chatgpt:/run/secrets/chatgpt
      - /opt/stacks/entrypoint.sh:/run/entrypoint.sh:ro
    # Wrap prod_entrypoint.sh with the shared key wrapper. Fails closed if
    # the key file is missing so the proxy never starts with an empty key.
    entrypoint:
      - /bin/sh
      - /run/entrypoint.sh
    command:
      - /app/docker/prod_entrypoint.sh
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    networks: [default, lifecycle_control]

  # Unofficial personal-use Images API shim -> native chatgpt/ Responses route.
  # Docker-only: no host port. Only the gateway key is mounted, never OAuth.
  chatgpt-images:
    build: ./chatgpt_images
    image: chatgpt-images:local
    container_name: chatgpt-images
    restart: unless-stopped
    # Match the owner of the 0600 gateway key; no root/DAC override needed.
    user: "1000:1000"
    environment:
      - GATEWAY_KEY_FILE=/run/secrets/litellm.key
    volumes:
      - /opt/secrets/litellm.key:/run/secrets/litellm.key:ro
    # aiohttp spools multipart file parts > ~1 MiB to disk; the read-only
    # rootfs needs a writable /tmp or real photos fail with FileNotFoundError.
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - default
      - webui
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8180/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ComfyUI lifecycle proxy. Open WebUI's ComfyUI engine points here instead of
  # at ComfyUI directly: mutating requests wake the comfyui container on demand
  # and it is stopped after IDLE_TIMEOUT, mirroring the llama.cpp idle manager.
  # /object_info is answered from a cache so listing models (and Verify URL) in
  # Open WebUI never starts the GPU. Only one GPU tenant runs at a time.
  comfyui-proxy:
    build: ./comfyui_proxy
    image: comfyui-proxy:local
    container_name: comfyui-proxy
    restart: unless-stopped
    env_file:
      - /opt/secrets/lifecycle-comfyui-proxy.env
    environment:
      - TZ=Europe/Vienna
      - PORT=8189
      - COMFYUI_CONTAINER=comfyui
      - COMFYUI_UPSTREAM=http://${LAN_IP}:8188
      - COMFYUI_HEALTH=http://${LAN_IP}:8188/system_stats
      # GPU tenants to stop before starting ComfyUI. ollama is cloud-only and
      # never holds the GPU, so it is not listed. strata (stack in
      # /opt/stacks/strata) is the other managed tenant of this card.
      - GPU_CONTAINERS=llama-server,llama-companion,llama-bolt,strata,strata-inkling
      - IDLE_TIMEOUT=${COMFYUI_IDLE_TIMEOUT:-900}
      - BOOT_TIMEOUT=${COMFYUI_BOOT_TIMEOUT:-90}
      - COMFYUI_OUTPUT_DIR=/output
      - LIFECYCLE_URL=https://lifecycle-gateway:8443
      - LIFECYCLE_ENV_ID=3
      - LIFECYCLE_CA_FILE=/run/secrets/lifecycle-server.pem
    ports:
      # LAN binding: consumed by OpenWebUI (container).
      # Loopback binding: consumed by host tools (opencode's comfyui MCP
      # server), so they need no LAN IP in tracked config.
      - "${LAN_IP}:8189:8189"
      - "127.0.0.1:8189:8189"
    volumes:
      # Single source of truth with the litellm idle manager.
      - /opt/stacks/litellm/gpu_containers.py:/app/gpu_containers.py:ro
      - /opt/secrets/lifecycle-server.pem:/run/secrets/lifecycle-server.pem:ro
      # Static output files, served by /view while ComfyUI is stopped.
      - /opt/stacks/comfyui/output:/output:ro
    networks: [default, lifecycle_control]

networks:
  lifecycle_control:
    external: true
    name: lifecycle_control
  # Open WebUI can reach the shim without exposing subscription access on LAN.
  webui:
    external: true
    name: webui_default
