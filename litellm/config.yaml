model_list:
  # Exposes the local llama.cpp server (OpenAI-compatible) as a single
  # user-facing model name. The upstream model id is the alias set via
  # LLAMA_ALIAS in /opt/stacks/llama-cpp/.env (qwen3.8:27b).
  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8:27b
      api_base: os.environ/LLAMA_MAIN_API_BASE
      api_key: none
      # llama.cpp's Qwen3 chat template supports reasoning_effort, but litellm
      # doesn't know this model supports it. Allow it through instead of
      # rejecting the request.
      allowed_openai_params:
        - reasoning_effort

  # Abliterated companion model (Huihui Qwen3.8-27B, GSQ-RCO IQ3_S-MTP),
  # served by llama-companion on port 8086 with the same runtime settings as
  # the main model. Only one of the llama.cpp containers below can hold the GPU
  # at a time; the idle-manager callback in custom_callbacks.py stops the others
  # and cold-starts the requested one.
  - model_name: qwen3.8-27b-abliterated
    litellm_params:
      model: openai/qwen3.8:27b-abliterated
      api_base: os.environ/LLAMA_COMPANION_API_BASE
      api_key: none
      # llama.cpp's Qwen3 chat template supports reasoning_effort; allow it
      # through instead of rejecting the request (same as qwen3.8-27b).
      allowed_openai_params:
        - reasoning_effort

  # ------------------------------------------------------------------------
  # OpenCode Go subscription models (https://opencode.ai/docs/go/).
  # Key: OPENCODE_GO_API_KEY in /opt/secrets/litellm.env.
  # The Go gateway requires x-opencode-session on every request; the
  # OpenCodeGoSessionHeader callback in custom_callbacks.py adds it (and a
  # fixed User-Agent) for the model names in OPENCODE_GO_MODELS (compose.yml).
  # Endpoint styles differ per model: most are OpenAI chat/completions,
  # GPT 5.6 Luna is Responses API only, the Qwen and Haiku models are Anthropic
  # /messages style (and expect x-api-key, which litellm's anthropic
  # provider sends by default).
  # ------------------------------------------------------------------------
  - model_name: glm-5.3-flash
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: gpt-5.6-luna
    litellm_params:
      # Responses API model; litellm bridges /chat/completions to /responses.
      model: openai/responses/gpt-5.6-luna
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: gpt-6-luna
    litellm_params:
      # Responses API model; litellm bridges /chat/completions to /responses.
      model: openai/responses/gpt-6-luna
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: muse-spark-1.3-contributor
    litellm_params:
      # Responses API model; litellm bridges /chat/completions to /responses.
      model: openai/responses/muse-spark-1.3-contributor
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: kimi-k2.7-code
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: mimo-v2.6-flash
    litellm_params:
      model: openai/mimo-v2.6-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: mimo-v2.6-pro
    litellm_params:
      model: openai/mimo-v2.6-pro
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: qwen3.8-max
    litellm_params:
      model: openai/qwen3.8-max
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # qwen3.8-max is also served on the Go OpenAI-compatible endpoint, where
      # raw reasoning_effort is native. litellm doesn't know this model supports
      # it, so allowlist it (same pattern as the other Go models above).
      allowed_openai_params:
        - reasoning_effort

  - model_name: qwen3.8-flash
    litellm_params:
      model: openai/qwen3.8-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # See qwen3.8-max: served on the Go OpenAI-compatible endpoint, raw
      # reasoning_effort is native, so allowlist it.
      allowed_openai_params:
        - reasoning_effort

  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      # litellm appends /v1/messages to the api_base.
      api_base: https://opencode.ai/zen/go
      api_key: os.environ/OPENCODE_GO_API_KEY
      # claude-haiku-5-5 is already flagged adaptive in litellm's cost map, so
      # reasoning_effort is mapped to adaptive thinking automatically. Do NOT
      # allowlist reasoning_effort: forwarding the raw field is rejected by
      # the gateway ("reasoning_effort: Extra inputs are not permitted").

  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

litellm_settings:
  # Register the idle-manager callback (pre-call start + idle-stop) and the
  # OpenCode Go session-header callback.
  callbacks:
    - custom_callbacks.proxy_handler_instance
    - custom_callbacks.opencode_go_session_header

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Emit a final usage chunk on every streamed response so clients (OpenWebUI)
  # get token counts even without stream_options.include_usage.
  always_include_stream_usage: true
