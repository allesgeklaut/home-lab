model_list:
  # ChatGPT subscription (Codex OAuth). Tokens live in /opt/secrets/chatgpt.
  # Prefix aliases to distinguish them from the OpenCode Go routes.
  - model_name: chatgpt-gpt-6.1-sol
    litellm_params:
      model: chatgpt/gpt-6.1-sol
    model_info:
      mode: responses

  - model_name: chatgpt-gpt-6-astra
    litellm_params:
      model: chatgpt/gpt-6-astra
    model_info:
      mode: responses

  - model_name: chatgpt-gpt-6-luna
    litellm_params:
      model: chatgpt/gpt-6-luna
    model_info:
      mode: responses

  # Mistral-hosted models. Key loaded from /opt/secrets/mistral.env.
  # Distinguish GLM from the existing OpenCode Go route named glm-5.3.
  - model_name: glm-5.3-mistral
    litellm_params:
      model: mistral/zai-glm-5-3
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mistral-large-4
    litellm_params:
      model: mistral/mistral-large-4
      api_key: os.environ/MISTRAL_API_KEY

  # Cheap/fast daily-driver chat model. -latest alias auto-tracks the newest
  # Mistral Small release (256K ctx); see webui README for the role split
  # between this and the frontier models above.
  - model_name: mistral-small
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY

  # Voxtral TTS 3 for Open WebUI voice chat, exposed on the OpenAI speech route
  # (POST /v1/audio/speech). The `voice` value Open WebUI sends is rewritten by
  # the VoxtralVoiceAlias callback (see custom_callbacks.py): readable names
  # (heidi, mary, mary-uk, harriet, paul-cheerful, ...) map to Mistral preset
  # voice IDs, and
  # "auto" uses a lightweight per-chunk language heuristic (umlauts + common
  # word lists): German -> Heidi, English -> Mary (UK); ties/ambiguous chunks
  # and other languages default to Heidi. "harriet" remains an explicit alias
  # for Harriet. OpenAI voice names (alloy, nova, ...) are auto-mapped by
  # litellm; preset IDs and UUIDs pass through.
  - model_name: voxtral-tts
    litellm_params:
      model: mistral/voxtral-mini-tts-3-0
      api_key: os.environ/MISTRAL_API_KEY
    model_info:
      mode: audio_speech

  # Voxtral Small Transcribe 3 batch transcription for Open WebUI voice input
  # (POST /v1/audio/transcriptions). Open WebUI records, then transcribes;
  # the realtime variant is for streaming pipelines and not used here. The
  # VoxtralSttContextBias callback injects a home-lab vocabulary context_bias
  # into every request (see custom_callbacks.py).
  - model_name: voxtral-stt
    litellm_params:
      model: mistral/voxtral-small-transcribe-3-0
      api_key: os.environ/MISTRAL_API_KEY
    model_info:
      mode: audio_transcription

  # Mistral Embed for Open WebUI document RAG (POST /v1/embeddings).
  # The plain model name is the always-current alias (no -latest suffix).
  # Switching the embedding model requires re-embedding existing documents
  # (Open WebUI Admin -> Documents -> Reindex); see webui README.
  - model_name: mistral-embed
    litellm_params:
      model: mistral/mistral-embed
      api_key: os.environ/MISTRAL_API_KEY
    model_info:
      mode: embedding

  # Exposes the local llama.cpp server (OpenAI-compatible) as a single
  # user-facing model name. The upstream model id is the alias set via
  # LLAMA_ALIAS in /opt/stacks/llama-cpp/.env (qwen3.8:27b).
  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8:27b
      api_base: os.environ/LLAMA_MAIN_API_BASE
      api_key: none
      # llama.cpp's Qwen3 chat template supports reasoning_effort, but litellm
      # doesn't know this model supports it. Allow it through instead of
      # rejecting the request.
      allowed_openai_params:
        - reasoning_effort

  # Abliterated companion model (Huihui Qwen3.8-27B, GSQ-RCO IQ3_S-MTP),
  # served by llama-companion on port 8086 with the same runtime settings as
  # the main model. Only one of the llama.cpp containers below can hold the GPU
  # at a time; the idle-manager callback in custom_callbacks.py stops the others
  # and cold-starts the requested one.
  - model_name: qwen3.8-27b-abliterated
    litellm_params:
      model: openai/qwen3.8:27b-abliterated
      api_base: os.environ/LLAMA_COMPANION_API_BASE
      api_key: none
      # llama.cpp's Qwen3 chat template supports reasoning_effort; allow it
      # through instead of rejecting the request (same as qwen3.8-27b).
      allowed_openai_params:
        - reasoning_effort

  # NVIDIA Nemotron 3.5 Bolt 74B-A9B (74B MoE / 9B active, IQ2_XXS, VLM)
  # served by llama-bolt on port 8085: auto-fit placement, DFlash drafter,
  # 256K context, vision. Same VRAM mutual exclusion as the Qwen models:
  # cold-started on demand by the idle manager, stopped after IDLE_TIMEOUT.
  - model_name: nemotron-bolt
    litellm_params:
      model: openai/nemotron-bolt
      api_base: os.environ/LLAMA_BOLT_API_BASE
      api_key: none
      # The Nemotron chat template has no reasoning_effort variable; thinking is
      # switched via chat_template_kwargs (enable_thinking / medium_effort).
      # NemotronBoltThinking in custom_callbacks.py maps the shared Thinking
      # control (reasoning_effort) onto those kwargs; allowlist both.
      allowed_openai_params:
        - reasoning_effort
        - chat_template_kwargs

  # ------------------------------------------------------------------------
  # OpenCode Go subscription models (https://opencode.ai/docs/go/).
  # Key: OPENCODE_GO_API_KEY in /opt/secrets/litellm.env.
  # The Go gateway requires x-opencode-session on every request; the
  # OpenCodeGoSessionHeader callback in custom_callbacks.py adds it (and a
  # fixed User-Agent) for the model names in OPENCODE_GO_MODELS (compose.yml).
  # Endpoint styles differ per model: most are OpenAI chat/completions,
  # GPT 5.6 Luna is Responses API only, the Qwen and Haiku models are Anthropic
  # /messages style (and expect x-api-key, which litellm's anthropic
  # provider sends by default).
  # ------------------------------------------------------------------------
  - model_name: glm-5.3-flash
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: gpt-5.6-luna
    litellm_params:
      # Responses API model; litellm bridges /chat/completions to /responses.
      model: openai/responses/gpt-5.6-luna
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: gpt-6-luna
    litellm_params:
      # Responses API model; litellm bridges /chat/completions to /responses.
      model: openai/responses/gpt-6-luna
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: muse-spark-1.3-contributor
    litellm_params:
      # Responses API model; litellm bridges /chat/completions to /responses.
      model: openai/responses/muse-spark-1.3-contributor
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort
    model_info:
      # The Responses bridge validates reasoning.effort against the model cost
      # map (allowed_openai_params is not consulted on that path) and 400s on
      # models it doesn't know. litellm's bundled map has no plain
      # "muse-spark-1.3-contributor" entry, while the gpt-*-luna names it does
      # have - which is why only this model broke. Declaring supports_reasoning
      # makes the router register it under the openai/<model> cost-map key, so
      # effort is forwarded (and LITELLM_REASONING_AUTO_SUMMARY adds the
      # "summary: detailed" that produces the OpenWebUI thinking block).
      supports_reasoning: true

  - model_name: kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: kimi-k2.7-code
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: mimo-v2.6-flash
    litellm_params:
      model: openai/mimo-v2.6-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: mimo-v2.6-pro
    litellm_params:
      model: openai/mimo-v2.6-pro
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: qwen3.8-max
    litellm_params:
      model: openai/qwen3.8-max
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # qwen3.8-max is also served on the Go OpenAI-compatible endpoint, where
      # raw reasoning_effort is native. litellm doesn't know this model supports
      # it, so allowlist it (same pattern as the other Go models above).
      allowed_openai_params:
        - reasoning_effort

  - model_name: qwen3.8-flash
    litellm_params:
      model: openai/qwen3.8-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # See qwen3.8-max: served on the Go OpenAI-compatible endpoint, raw
      # reasoning_effort is native, so allowlist it.
      allowed_openai_params:
        - reasoning_effort

  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      # litellm appends /v1/messages to the api_base.
      api_base: https://opencode.ai/zen/go
      api_key: os.environ/OPENCODE_GO_API_KEY
      # claude-haiku-5-5 is already flagged adaptive in litellm's cost map, so
      # reasoning_effort is mapped to adaptive thinking automatically. Do NOT
      # allowlist reasoning_effort: forwarding the raw field is rejected by
      # the gateway ("reasoning_effort: Extra inputs are not permitted").

  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # Go supports reasoning_effort (budget-mapped upstream); without this
      # litellm rejects the param as unsupported for the model.
      allowed_openai_params:
        - reasoning_effort

litellm_settings:
  # Register the idle-manager callback (pre-call start + idle-stop), the
  # OpenCode Go session-header callback, the Nemotron thinking mapper, the
  # Voxtral voice-alias/language-router callback, and the Voxtral STT
  # context-bias (home-lab vocabulary) callback.
  callbacks:
    - custom_callbacks.proxy_handler_instance
    - custom_callbacks.opencode_go_session_header
    - custom_callbacks.nemotron_bolt_thinking
    - custom_callbacks.voxtral_voice_alias
    - custom_callbacks.voxtral_stt_context_bias

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Emit a final usage chunk on every streamed response so clients (OpenWebUI)
  # get token counts even without stream_options.include_usage.
  always_include_stream_usage: true
