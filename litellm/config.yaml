model_list:
  # Exposes the RunPod vLLM endpoint (OpenAI-compatible) as a single
  # user-facing model name. The upstream model id is qwen/qwen3.8-27b
  # (served by the vLLM backend on the runpod serverless endpoint).
  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/qwen/qwen3.8-27b
      api_base: https://api.runpod.ai/v2/3m45gskzuccoxu/openai/v1
      api_key: os.environ/RUNPOD_API_KEY

litellm_settings:
  # Open WebUI sends params like reasoning_effort that vLLM does not accept;
  # silently drop them instead of erroring.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY