services:
  code-server:
    image: ghcr.io/coder/code-server:latest
    container_name: code-server
    restart: unless-stopped
    user: "1000:1000"
    # Publish ONLY on the Tailscale IP — no LAN/public exposure.
    # For a secure browser context use tailscale serve (valid TLS cert):
    #   sudo tailscale serve --bg --https=443 http://<tailscale-ip>:8443
    #   -> https://<machine>.<tailnet>.ts.net (tailnet-only, config is
    #      persistent in tailscaled.state and re-applied at boot)
    ports:
      - "100.123.8.67:8443:8080"
    env_file:
      - /opt/secrets/code-server.env
    environment:
      - TZ=Europe/Vienna
    volumes:
      # Workspace: the stacks mono repo (config lives here, data ignored)
      - /opt/stacks:/home/coder/workspace
      # code-server state (config, extensions, logs) — data dir, ignored in git
      - /opt/stacks/code-server/data:/home/coder/.local/share/code-server
      # Global Copilot config (~/.copilot/skills is a symlink into the
      # versioned /opt/stacks/copilot-skills folder, which is already in
      # the workspace mount)
      - /home/johannes/.copilot:/home/coder/.copilot
      # BYOK chat model config (LiteLLM) — same file the host VS Code uses
      - /home/johannes/.config/Code/User/chatLanguageModels.json:/home/coder/.local/share/code-server/User/chatLanguageModels.json:ro
      # Personal shell/git dotfiles, read-only (NOT the whole home dir —
      # that would expose ~/.ssh, tokens, browser data to the container)
      - /home/johannes/.bashrc:/home/coder/.bashrc:ro
      - /home/johannes/.gitconfig:/home/coder/.gitconfig:ro
      # Resolve absolute symlink targets (/opt/stacks/...) inside the container
      - /opt/stacks:/opt/stacks:ro
    command:
      - --auth=password
      - --bind-addr=0.0.0.0:8080
      - /home/coder/workspace