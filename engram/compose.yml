services:
  postgres:
    image: postgres:18-alpine
    container_name: engram-postgres
    restart: unless-stopped
    env_file:
      - /opt/secrets/engram.env
    environment:
      - TZ=Europe/Vienna
    volumes:
      - /opt/stacks/engram/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram -d engram_cloud"]
      interval: 10s
      timeout: 5s
      retries: 10

  cloud:
    image: ghcr.io/gentleman-programming/engram:3.6.0
    container_name: engram-cloud
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /opt/secrets/engram.env
    environment:
      - TZ=Europe/Vienna
    ports:
      # Loopback only — reached through HTTPS proxies, not directly from the LAN.
      # Tailscale Serve provides private HTTPS for /sync; retain bearer-token auth.
      - "127.0.0.1:18080:18080"
