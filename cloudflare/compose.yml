services:
  cloudflared:
    # Pinned: updates arrive as reviewable Dependabot PRs (.github/dependabot.yml).
    # Watchtower never moves an immutable version tag.
    image: cloudflare/cloudflared:2026.10.4
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    env_file:
      - /opt/secrets/cloudflare.env
    command: tunnel --no-autoupdate run

