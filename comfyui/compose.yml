name: comfyui

services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMFYUI_REF: 0f74f7fb9f83a78bf46188fd4fd53e6bc44c1ae8  # master 2026-09-20 (Qwen-Image-2.1 support)
    image: local/comfyui-rocm-radeon:rocm7.2.1
    container_name: comfyui
    restart: unless-stopped

    # 16 GB card: Qwen-Image-2.1 (7B int8 UNet + 8B text encoder) does not fit
    # both models resident. Unload models as soon as they are unused so the VAE
    # decode has room instead of OOMing at the end of sampling.
    command:
      - python
      - main.py
      - --listen
      - "0.0.0.0"
      - --port
      - "8188"
      - --disable-smart-memory
      # Fastest attention backend on gfx1200 (see the README speed table;
      # ~28.5 s vs ~40 s default at 1024x1024 / 25 steps), and faster than
      # pytorch/split/quad cross-attention. Also skip the comfy compiler
      # (--fast): measured no gain and a slow first run.
      - --use-ck-attention
      - --enable-triton-backend

    user: "1000:1000"

    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

    environment:
      TZ: Europe/Athens
      PYTHONUNBUFFERED: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

    ports:
      - "${COMFYUI_PORT:-8188}:8188"

    volumes:
      - /opt/stacks/comfyui/models:/opt/ComfyUI/models
      - /opt/stacks/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes
      - /opt/stacks/comfyui/output:/opt/ComfyUI/output
      - /opt/stacks/comfyui/input:/opt/ComfyUI/input
      - /opt/stacks/comfyui/user:/opt/ComfyUI/user

