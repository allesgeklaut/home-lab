# Image is pinned to the llama.cpp v1.0.0 release build (b12359), not the
# floating `server-rocm` tag, which tracks the latest nightly. Override with
# LLAMA_IMAGE in .env to move versions. llama-server and llama-companion share
# this one image; llama-bolt pins its own newer image (x-llama-bolt-image below).
x-llama-image: &llama-image ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-rocm-v1.0.0-b12359-b1b770d}

# The bolt slot needs a newer build: Inkling-2-Mini (inkling2_loop) requires
# llama.cpp >= b12611 (PR #32704, the loop-slot NVFP4 scale fix; without it
# the UD quants produce gibberish). The 2026-11-22 04:12 UTC daily build first
# published such a pinned tag. Override with LLAMA_BOLT_IMAGE in .env.
x-llama-bolt-image: &llama-bolt-image ${LLAMA_BOLT_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-rocm-b12627}

services:
  llama-server:
    image: *llama-image
    container_name: llama-server
    restart: "no"
    shm_size: '24gb'
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "992"   # render GID
      - "44"    # video GID
    ports:
      - "${LLAMA_HOST_IP}:8084:8080"
    volumes:
      - /opt/stacks/llama-cpp/models:/models:ro
    command:
      - -m
      - /models/${LLAMA_MODEL}
      - --mmproj
      - /models/${LLAMA_MMPROJ}
      - --no-mmproj-offload
      - --image-min-tokens
      - "${LLAMA_IMAGE_MIN_TOKENS}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - "${LLAMA_ALIAS}"
      # Layer offload: LLAMA_FIT=on (auto) or LLAMA_FIT=off (manual n-gpu-layers)
      - --fit
      - "${LLAMA_FIT}"
      - --fit-target
      - "${LLAMA_FIT_TARGET}"
      - --n-gpu-layers
      - "${LLAMA_N_GPU_LAYERS}"
      - --ctx-size
      - "${LLAMA_CTX_SIZE}"
      - --batch-size
      - "${LLAMA_BATCH_SIZE}"
      - --ubatch-size
      - "${LLAMA_UBATCH_SIZE}"
      - --parallel
      - "${LLAMA_PARALLEL}"
      - --jinja
      - --metrics
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "${LLAMA_SPEC_DRAFT_N_MAX}"
      - --cache-type-k
      - "${LLAMA_CACHE_TYPE_K}"
      - --cache-type-v
      - "${LLAMA_CACHE_TYPE_V}"
      # Host-RAM prompt cache cap (MiB). Defaults to 8192 if unset; see .env.
      - --cache-ram
      - "${LLAMA_CACHE_RAM:-8192}"
      - --flash-attn
      - "${LLAMA_FLASH_ATTN}"
      - --temp
      - "${LLAMA_TEMP}"
      - --top-p
      - "${LLAMA_TOP_P}"
      - --top-k
      - "${LLAMA_TOP_K}"
      - --min-p
      - "${LLAMA_MIN_P}"
      - --presence-penalty
      - "${LLAMA_PRESENCE_PENALTY}"
      - --reasoning
      - on
      - --reasoning-preserve
    #  - --sleep-idle-seconds
    #  - "600"

  # Abliterated companion model (Huihui Qwen3.8-27B, GSQ-RCO IQ3_S-MTP).
  # Purely on-demand: never started at boot and never auto-restarted, because
  # only one llama.cpp server can hold the 16 GB VRAM at a time. Started/stopped
  # by the litellm idle-manager callback depending on the requested model.
  # Serves with the SAME runtime settings as llama-server (all LLAMA_* values
  # above); only the model, projector and alias differ.
  llama-companion:
    image: *llama-image
    container_name: llama-companion
    restart: "no"
    shm_size: '24gb'
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "992"   # render GID
      - "44"    # video GID
    ports:
      - "${LLAMA_HOST_IP}:8086:8080"
    volumes:
      - /opt/stacks/llama-cpp/models:/models:ro
    command:
      - -m
      - /models/${COMPANION_MODEL}
      - --mmproj
      - /models/${COMPANION_MMPROJ}
      - --no-mmproj-offload
      - --image-min-tokens
      - "${LLAMA_IMAGE_MIN_TOKENS}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - "${COMPANION_ALIAS}"
      - --fit
      - "${LLAMA_FIT}"
      - --fit-target
      - "${LLAMA_FIT_TARGET}"
      - --n-gpu-layers
      - "${LLAMA_N_GPU_LAYERS}"
      - --ctx-size
      - "${LLAMA_CTX_SIZE}"
      - --batch-size
      - "${LLAMA_BATCH_SIZE}"
      - --ubatch-size
      - "${LLAMA_UBATCH_SIZE}"
      - --parallel
      - "${LLAMA_PARALLEL}"
      - --jinja
      - --metrics
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "${LLAMA_SPEC_DRAFT_N_MAX}"
      - --cache-type-k
      - "${LLAMA_CACHE_TYPE_K}"
      - --cache-type-v
      - "${LLAMA_CACHE_TYPE_V}"
      - --cache-ram
      - "${LLAMA_CACHE_RAM:-8192}"
      - --flash-attn
      - "${LLAMA_FLASH_ATTN}"
      - --temp
      - "${LLAMA_TEMP}"
      - --top-p
      - "${LLAMA_TOP_P}"
      - --top-k
      - "${LLAMA_TOP_K}"
      - --min-p
      - "${LLAMA_MIN_P}"
      - --presence-penalty
      - "${LLAMA_PRESENCE_PENALTY}"
      - --reasoning
      - on
      - --reasoning-preserve

  # Generic small/fast "Bolt" slot: Inkling-2-Mini UD-Q4_K_XL (26.4B MoE,
  # looped transformer) + unsloth F16 projector, on-demand like
  # llama-server/companion. Uses its own newer image (x-llama-bolt-image,
  # server-rocm-b12627) because inkling2_loop needs >= b12611. The 17.6 GB
  # weights exceed the 16 GB VRAM, so experts are split by --override-tensor
  # below (16/24 layers on GPU, rest in host RAM). DSpark spec decoding is
  # not in mainline yet (#32218) -> off. Embedded chat template via --jinja
  # (no override needed for Inkling).
  llama-bolt:
    image: *llama-bolt-image
    container_name: llama-bolt
    restart: "no"
    shm_size: '24gb'
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "992"   # render GID
      - "44"    # video GID
    ports:
      - "${LLAMA_HOST_IP}:8085:8080"
    volumes:
      - /opt/stacks/llama-cpp/models:/models:ro
    command:
      - -m
      - /models/${BOLT_MODEL}
      - --mmproj
      - /models/${BOLT_MMPROJ}
      - --no-mmproj-offload
      - --image-min-tokens
      - "${BOLT_IMAGE_MIN_TOKENS}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - "${BOLT_ALIAS}"
      - --fit
      - "${BOLT_FIT}"
      - --fit-target
      - "${BOLT_FIT_TARGET}"
      - --n-gpu-layers
      - "${BOLT_N_GPU_LAYERS}"
      # Manual expert split (fit aborts when ngl/-ot are set, so ngl 99 +
      # overrides rule): 16 layers' experts stay on GPU incl. the looped core
      # blk 6-17 (runs 3x per token); blk 0-3 and 20-23 go to host RAM.
      # ubatch MUST stay 128: the loop graph's pp buffer at ubatch 256 is
      # ~6.5 GB and OOMs at 131072 ctx no matter the split (verified).
      # --load-mode none avoids mmap stalls on CPU-resident tensors.
      - --override-tensor
      - "blk\\.(0|1|2|3|20|21|22|23)\\.ffn_.*_exps\\.weight=CPU"
      - --load-mode
      - none
      - --ctx-size
      - "${BOLT_CTX_SIZE}"
      - --batch-size
      - "${BOLT_BATCH_SIZE}"
      - --ubatch-size
      - "${BOLT_UBATCH_SIZE}"
      - --parallel
      - "${BOLT_PARALLEL}"
      - --jinja
      - --metrics
      - --cache-type-k
      - "${BOLT_CACHE_TYPE_K}"
      - --cache-type-v
      - "${BOLT_CACHE_TYPE_V}"
      - --cache-ram
      - "${BOLT_CACHE_RAM}"
      - --flash-attn
      - "${BOLT_FLASH_ATTN}"
      - --temp
      - "${BOLT_TEMP}"
      - --top-p
      - "${BOLT_TOP_P}"
      - --top-k
      - "${BOLT_TOP_K}"
      - --min-p
      - "${BOLT_MIN_P}"
      - --presence-penalty
      - "${BOLT_PRESENCE_PENALTY}"
      - --reasoning
      - on
