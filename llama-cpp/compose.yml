services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llama-server
    restart: "no"
    shm_size: '24gb'
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "992"   # render GID
      - "44"    # video GID
    ports:
      - "${LLAMA_HOST_IP}:8084:8080"
    volumes:
      - /opt/stacks/llama-cpp/models:/models:ro
    command:
      - -m
      - /models/${LLAMA_MODEL}
      - --mmproj
      - /models/${LLAMA_MMPROJ}
      - --no-mmproj-offload
      - --image-min-tokens
      - "${LLAMA_IMAGE_MIN_TOKENS}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - "${LLAMA_ALIAS}"
      # Layer offload: LLAMA_FIT=on (auto) or LLAMA_FIT=off (manual n-gpu-layers)
      - --fit
      - "${LLAMA_FIT}"
      - --fit-target
      - "${LLAMA_FIT_TARGET}"
      - --n-gpu-layers
      - "${LLAMA_N_GPU_LAYERS}"
      - --ctx-size
      - "${LLAMA_CTX_SIZE}"
      - --batch-size
      - "${LLAMA_BATCH_SIZE}"
      - --ubatch-size
      - "${LLAMA_UBATCH_SIZE}"
      - --parallel
      - "${LLAMA_PARALLEL}"
      - --jinja
      - --metrics
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "${LLAMA_SPEC_DRAFT_N_MAX}"
      - --cache-type-k
      - "${LLAMA_CACHE_TYPE_K}"
      - --cache-type-v
      - "${LLAMA_CACHE_TYPE_V}"
      # Host-RAM prompt cache cap (MiB). Defaults to 8192 if unset; see .env.
      - --cache-ram
      - "${LLAMA_CACHE_RAM:-8192}"
      - --flash-attn
      - "${LLAMA_FLASH_ATTN}"
      - --temp
      - "${LLAMA_TEMP}"
      - --top-p
      - "${LLAMA_TOP_P}"
      - --top-k
      - "${LLAMA_TOP_K}"
      - --min-p
      - "${LLAMA_MIN_P}"
      - --presence-penalty
      - "${LLAMA_PRESENCE_PENALTY}"
      - --reasoning
      - on
      - --reasoning-preserve
    #  - --sleep-idle-seconds
    #  - "600"

  # Abliterated companion model (Huihui Qwen3.8-27B, GSQ-RCO IQ3_S-MTP).
  # Purely on-demand: never started at boot and never auto-restarted, because
  # only one llama.cpp server can hold the 16 GB VRAM at a time. Started/stopped
  # by the litellm idle-manager callback depending on the requested model.
  # Serves with the SAME runtime settings as llama-server (all LLAMA_* values
  # above); only the model, projector and alias differ.
  llama-companion:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llama-companion
    restart: "no"
    shm_size: '24gb'
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "992"   # render GID
      - "44"    # video GID
    ports:
      - "${LLAMA_HOST_IP}:8086:8080"
    volumes:
      - /opt/stacks/llama-cpp/models:/models:ro
    command:
      - -m
      - /models/${COMPANION_MODEL}
      - --mmproj
      - /models/${COMPANION_MMPROJ}
      - --no-mmproj-offload
      - --image-min-tokens
      - "${LLAMA_IMAGE_MIN_TOKENS}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - "${COMPANION_ALIAS}"
      - --fit
      - "${LLAMA_FIT}"
      - --fit-target
      - "${LLAMA_FIT_TARGET}"
      - --n-gpu-layers
      - "${LLAMA_N_GPU_LAYERS}"
      - --ctx-size
      - "${LLAMA_CTX_SIZE}"
      - --batch-size
      - "${LLAMA_BATCH_SIZE}"
      - --ubatch-size
      - "${LLAMA_UBATCH_SIZE}"
      - --parallel
      - "${LLAMA_PARALLEL}"
      - --jinja
      - --metrics
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "${LLAMA_SPEC_DRAFT_N_MAX}"
      - --cache-type-k
      - "${LLAMA_CACHE_TYPE_K}"
      - --cache-type-v
      - "${LLAMA_CACHE_TYPE_V}"
      - --cache-ram
      - "${LLAMA_CACHE_RAM:-8192}"
      - --flash-attn
      - "${LLAMA_FLASH_ATTN}"
      - --temp
      - "${LLAMA_TEMP}"
      - --top-p
      - "${LLAMA_TOP_P}"
      - --top-k
      - "${LLAMA_TOP_K}"
      - --min-p
      - "${LLAMA_MIN_P}"
      - --presence-penalty
      - "${LLAMA_PRESENCE_PENALTY}"
      - --reasoning
      - on
      - --reasoning-preserve

  # NVIDIA Nemotron 3.5 Bolt 74B-A9B (IQ2_XXS VLM) - primary local model.
  # Auto-fit placement (no -ngl/-ot needed). Mutually exclusive with llama-server/companion (VRAM).
  # Config: fit-target 1536 + ubatch 1024 + ctx 262144 + q8_0 KV, mmproj on CPU.
  # Measured: decode ~42-49 t/s via DFlash acceptance; prefill 594 t/s @31k, 460 t/s @150k.
  # Vision runs on the CPU (--no-mmproj-offload): the GPU encoder OOM-kills the process on
  # photos even with --image-max-tokens 4096, because the DFlash drafter (documented 1-2 GB,
  # invisible to --fit) leaves no headroom. CPU encode costs ~2 min per 12 MP photo.
  # fit 512 is unsafe (drafter OOM); 1536 keeps margin for the drafter.
  # --moe-cache-mib combines with fit (fit accounts for it) but is perf-neutral here.
  # Port 8085. Start: docker compose up -d llama-bolt
  llama-bolt:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llama-bolt
    restart: "no"
    shm_size: '24gb'
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "992"   # render GID
      - "44"    # video GID
    ports:
      - "${LLAMA_HOST_IP}:8085:8080"
    volumes:
      - /opt/stacks/llama-cpp/models:/models:ro
    command:
      - -m
      - /models/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-IQ2_XXS.gguf
      - --mmproj
      - /models/mmproj-BF16.gguf
      - --no-mmproj-offload
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - nemotron-bolt
      # No -ngl / no -ot: --fit decides the placement itself.
      - --fit
      - "on"
      - --fit-target
      - "1536"
      - --ctx-size
      - "262144"
      - --batch-size
      - "2048"
      - --ubatch-size
      - "1024"
      - --parallel
      - "1"
      - --jinja
      - --metrics
      - --spec-type
      - draft-dflash
      - --spec-draft-model
      - /models/dflash-NVIDIA-Nemotron-3.5-Bolt-74B-A9B-NVFP4.gguf
      - --spec-draft-ngl
      - "999"
      - --spec-draft-n-max
      - "6"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --cache-ram
      - "2048"
      - --flash-attn
      - on
      - --temp
      - "1.0"
      - --top-p
      - "0.95"
      - --reasoning
      - on
