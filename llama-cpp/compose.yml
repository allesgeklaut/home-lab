# Image is pinned to the llama.cpp v1.0.0 release build (b12359), not the
# floating `server-rocm` tag, which tracks the latest nightly. Override with
# LLAMA_IMAGE in .env to move versions. All services share the one image.
x-llama-image: &llama-image ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-rocm-v1.0.0-b12359-b1b770d}

services:
  llama-server:
    image: *llama-image
    container_name: llama-server
    restart: "no"
    shm_size: '24gb'
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "992"   # render GID
      - "44"    # video GID
    ports:
      - "${LLAMA_HOST_IP}:8084:8080"
    volumes:
      - /opt/stacks/llama-cpp/models:/models:ro
    command:
      - -m
      - /models/${LLAMA_MODEL}
      - --mmproj
      - /models/${LLAMA_MMPROJ}
      - --no-mmproj-offload
      - --image-min-tokens
      - "${LLAMA_IMAGE_MIN_TOKENS}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - "${LLAMA_ALIAS}"
      # Layer offload: LLAMA_FIT=on (auto) or LLAMA_FIT=off (manual n-gpu-layers)
      - --fit
      - "${LLAMA_FIT}"
      - --fit-target
      - "${LLAMA_FIT_TARGET}"
      - --n-gpu-layers
      - "${LLAMA_N_GPU_LAYERS}"
      - --ctx-size
      - "${LLAMA_CTX_SIZE}"
      - --batch-size
      - "${LLAMA_BATCH_SIZE}"
      - --ubatch-size
      - "${LLAMA_UBATCH_SIZE}"
      - --parallel
      - "${LLAMA_PARALLEL}"
      - --jinja
      - --metrics
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "${LLAMA_SPEC_DRAFT_N_MAX}"
      - --cache-type-k
      - "${LLAMA_CACHE_TYPE_K}"
      - --cache-type-v
      - "${LLAMA_CACHE_TYPE_V}"
      # Host-RAM prompt cache cap (MiB). Defaults to 8192 if unset; see .env.
      - --cache-ram
      - "${LLAMA_CACHE_RAM:-8192}"
      - --flash-attn
      - "${LLAMA_FLASH_ATTN}"
      - --temp
      - "${LLAMA_TEMP}"
      - --top-p
      - "${LLAMA_TOP_P}"
      - --top-k
      - "${LLAMA_TOP_K}"
      - --min-p
      - "${LLAMA_MIN_P}"
      - --presence-penalty
      - "${LLAMA_PRESENCE_PENALTY}"
      - --reasoning
      - on
      - --reasoning-preserve
    #  - --sleep-idle-seconds
    #  - "600"

  # Abliterated companion model (Huihui Qwen3.8-27B, GSQ-RCO IQ3_S-MTP).
  # Purely on-demand: never started at boot and never auto-restarted, because
  # only one llama.cpp server can hold the 16 GB VRAM at a time. Started/stopped
  # by the litellm idle-manager callback depending on the requested model.
  # Serves with the SAME runtime settings as llama-server (all LLAMA_* values
  # above); only the model, projector and alias differ.
  llama-companion:
    image: *llama-image
    container_name: llama-companion
    restart: "no"
    shm_size: '24gb'
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "992"   # render GID
      - "44"    # video GID
    ports:
      - "${LLAMA_HOST_IP}:8086:8080"
    volumes:
      - /opt/stacks/llama-cpp/models:/models:ro
    command:
      - -m
      - /models/${COMPANION_MODEL}
      - --mmproj
      - /models/${COMPANION_MMPROJ}
      - --no-mmproj-offload
      - --image-min-tokens
      - "${LLAMA_IMAGE_MIN_TOKENS}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - "${COMPANION_ALIAS}"
      - --fit
      - "${LLAMA_FIT}"
      - --fit-target
      - "${LLAMA_FIT_TARGET}"
      - --n-gpu-layers
      - "${LLAMA_N_GPU_LAYERS}"
      - --ctx-size
      - "${LLAMA_CTX_SIZE}"
      - --batch-size
      - "${LLAMA_BATCH_SIZE}"
      - --ubatch-size
      - "${LLAMA_UBATCH_SIZE}"
      - --parallel
      - "${LLAMA_PARALLEL}"
      - --jinja
      - --metrics
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "${LLAMA_SPEC_DRAFT_N_MAX}"
      - --cache-type-k
      - "${LLAMA_CACHE_TYPE_K}"
      - --cache-type-v
      - "${LLAMA_CACHE_TYPE_V}"
      - --cache-ram
      - "${LLAMA_CACHE_RAM:-8192}"
      - --flash-attn
      - "${LLAMA_FLASH_ATTN}"
      - --temp
      - "${LLAMA_TEMP}"
      - --top-p
      - "${LLAMA_TOP_P}"
      - --top-k
      - "${LLAMA_TOP_K}"
      - --min-p
      - "${LLAMA_MIN_P}"
      - --presence-penalty
      - "${LLAMA_PRESENCE_PENALTY}"
      - --reasoning
      - on
      - --reasoning-preserve

  # Generic small/fast "Bolt" slot (MiMo-V2.6-Distill-Qwen-9B Q6_K + ggml-org
  # Q8_0 projector), on-demand like llama-server/companion. Sized for the
  # Q6_K weights (~7.8 GB) plus vision buffers; MiMo has no nextn/MTP head,
  # so speculative decoding is disabled. The chat template is overridden
  # from templates/mimo-v2.6.jinja for correct MiMo tool-call parsing.
  llama-bolt:
    image: *llama-image
    container_name: llama-bolt
    restart: "no"
    shm_size: '24gb'
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "992"   # render GID
      - "44"    # video GID
    ports:
      - "${LLAMA_HOST_IP}:8085:8080"
    volumes:
      - /opt/stacks/llama-cpp/models:/models:ro
      - /opt/stacks/llama-cpp/templates:/templates:ro
    command:
      - -m
      - /models/${BOLT_MODEL}
      - --mmproj
      - /models/${BOLT_MMPROJ}
      - --no-mmproj-offload
      - --image-min-tokens
      - "${BOLT_IMAGE_MIN_TOKENS}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - "${BOLT_ALIAS}"
      - --fit
      - "${BOLT_FIT}"
      - --fit-target
      - "${BOLT_FIT_TARGET}"
      - --n-gpu-layers
      - "${BOLT_N_GPU_LAYERS}"
      - --ctx-size
      - "${BOLT_CTX_SIZE}"
      - --batch-size
      - "${BOLT_BATCH_SIZE}"
      - --ubatch-size
      - "${BOLT_UBATCH_SIZE}"
      - --parallel
      - "${BOLT_PARALLEL}"
      - --jinja
      - --chat-template-file
      - /templates/mimo-v2.6.jinja
      - --metrics
      - --cache-type-k
      - "${BOLT_CACHE_TYPE_K}"
      - --cache-type-v
      - "${BOLT_CACHE_TYPE_V}"
      - --cache-ram
      - "${BOLT_CACHE_RAM}"
      - --flash-attn
      - "${BOLT_FLASH_ATTN}"
      - --temp
      - "${BOLT_TEMP}"
      - --top-p
      - "${BOLT_TOP_P}"
      - --top-k
      - "${BOLT_TOP_K}"
      - --min-p
      - "${BOLT_MIN_P}"
      - --presence-penalty
      - "${BOLT_PRESENCE_PENALTY}"
      - --reasoning
      - on
