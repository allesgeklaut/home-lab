services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    restart: unless-stopped
    command: serve
    ports:
      - "10000:80"
    volumes:
      - ./config:/etc/ntfy
      - ./cache:/var/cache/ntfy
      - ./data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Iq '\"healthy\":true'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
