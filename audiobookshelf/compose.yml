services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    user: "1000:1000"
    ports:
      - 13378:13378
    volumes:
      - /mnt/nas-audiobookshelf/audiobooks:/audiobooks
      - /mnt/nas-audiobookshelf/podcasts:/podcasts
      - /opt/stacks/audiobookshelf/config:/config
      - /opt/stacks/audiobookshelf/metadata:/metadata
    environment:
      - TZ=Europe/Vienna
      - PORT=13378
    restart: unless-stopped

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
    volumes:
      - /opt/stacks/audiobookshelf/calibre-web/config:/config
      - /mnt/nas-audiobookshelf/ebooks:/books
    ports:
      - 8083:8083
    restart: unless-stopped

  storyteller:
    image: registry.gitlab.com/storyteller-platform/storyteller:latest
    container_name: storyteller
    env_file:
      - /opt/secrets/audiobookshelf.env
    environment:
      - TZ=Europe/Vienna
      - PUID=1000
      - PGID=1000
    volumes:
      - /opt/stacks/audiobookshelf/storyteller/data:/data
      # Auto-import / watch folder (one book per folder).
      - /mnt/nas-audiobookshelf/storyteller-import:/library
      # Source libraries, browsable from the UI via "Import from server":
      #  - audiobooks read-only (never rewritten)
      #  - ebooks read-write so Storyteller can convert EPUB2 -> 3 in place
      - /mnt/nas-audiobookshelf/audiobooks:/audiobooks:ro
      - /mnt/nas-audiobookshelf/ebooks:/ebooks
    ports:
      - 8001:8001
    restart: unless-stopped
