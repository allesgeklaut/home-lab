[tools.bash]
permission = "ask"
denylist = [
    "*--break-system-packages*",
]
sensitive_file_patterns = [
    "*.env",
    "*.env.*",
    ".envrc",
    "*.pem",
    "*.key",
    "*credentials.json",
    "*credentials.yml",
    "*credentials.yaml",
    "*.credentials*",
]
allowlist = [
    "basename",
    "cat",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "file",
    "find",
    "fmt",
    "fold",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "md5sum",
    "more",
    "nl",
    "od",
    "paste",
    "pwd",
    "readlink",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "uname",
    "uniq",
    "vibe-path:directory_recursive:/opt/stacks/.playwright-out",
    "vibe-path:directory_recursive:/tmp",
    "wc",
    "which",
]

[tools.read_file]
denylist = [
    "/opt/secrets/*",
    "/home/johannes/.ssh/*",
]
sensitive_patterns = [
    "*.env",
    "*.env.*",
    ".envrc",
    "*.pem",
    "*.key",
    "*credentials.json",
    "*credentials.yml",
    "*credentials.yaml",
    "*.credentials*",
]
allowlist = [
    "vibe-path:directory_recursive:/tmp",
    "vibe-path:directory_recursive:/opt/stacks/.playwright-out",
]

[tools.edit]
denylist = [
    "/opt/secrets/*",
    "/home/johannes/.ssh/*",
]

[tools.write_file]
denylist = [
    "/opt/secrets/*",
    "/home/johannes/.ssh/*",
]

[[mcp_servers]]
name = "engram"
transport = "stdio"
# stdio children get only a curated env: derive HOME, auto-export the
# per-device env file (~/.vibe/.env -> /opt/secrets/vibe.env), then exec
command = "bash"
args = [
    "-c",
    'export HOME="${HOME:-$(getent passwd "$(id -u)" | cut -d: -f6)}"; set -a; [ -f "$HOME/.vibe/.env" ] && source "$HOME/.vibe/.env"; set +a; exec engram mcp --tools=agent',
]

[[mcp_servers]]
name = "deep-research"
transport = "stdio"
# Pin to the litellm/Studio env file: never inherit MISTRAL_API_KEY from
# vibe's own env (~/.vibe/.env -> /opt/secrets/vibe.env holds the vibe-quota
# key, which must not be used for the Studio deep-research agent).
command = "bash"
args = [
    "-c",
    'unset MISTRAL_API_KEY; export MISTRAL_API_KEY_FILE="${MISTRAL_API_KEY_FILE:-/opt/secrets/mistral.env}"; exec uvx --with fastmcp --with httpx python /opt/stacks/webui/mcpo/deep-research/deep_research_mcp_server.py',
]
tool_timeout_sec = 300

[[mcp_servers]]
name = "github"
transport = "streamable-http"
url = "https://api.githubcopilot.com/mcp/"

[mcp_servers.auth]
type = "static"
api_key_env = "GITHUB_TOKEN"
api_key_header = "Authorization"
api_key_format = "Bearer {token}"

[[mcp_servers]]
name = "trilium"
transport = "stdio"
# token comes from TRILIUM_API_TOKEN in ~/.vibe/.env, auto-exported below
command = "bash"
args = [
    "-c",
    'export HOME="${HOME:-$(getent passwd "$(id -u)" | cut -d: -f6)}"; set -a; [ -f "$HOME/.vibe/.env" ] && source "$HOME/.vibe/.env"; set +a; export TRILIUM_API_URL="http://192.168.0.46:9910/etapi"; exec npx -y triliumnext-mcp',
]
tool_timeout_sec = 30

[[mcp_servers]]
name = "playwright"
transport = "stdio"
command = "docker"
args = [
    "run",
    "--rm",
    "-i",
    "--network",
    "host",
    "-v",
    "/opt/stacks:/opt/stacks:ro",
    "-v",
    "/opt/stacks/.playwright-out:/opt/stacks/.playwright-out",
    "mcr.microsoft.com/playwright/mcp:latest",
    "--headless",
    "--browser",
    "chromium",
    "--output-dir",
    "/opt/stacks/.playwright-out",
]
tool_timeout_sec = 30

[[mcp_servers]]
name = "godot-ai"
transport = "stdio"
command = "/home/johannes/.local/bin/uvx"
args = [
    "--python",
    "3.12",
    "--isolated",
    "--no-config",
    "--no-env-file",
    "--no-sources",
    "--no-build",
    "--index-strategy",
    "first-index",
    "--keyring-provider",
    "disabled",
    "--index",
    "https://pypi.org/simple",
    "--default-index",
    "https://pypi.org/simple",
    "--find-links",
    "https://pypi.org/simple/godot-ai/",
    "--link-mode",
    "copy",
    "--from",
    "godot-ai==4.3.0",
    "godot-ai",
    "attach",
    "--port",
    "8000",
    "--ws-port",
    "9500",
]
tool_timeout_sec = 120

[[mcp_servers]]
name = "cloudflare"
transport = "streamable-http"
url = "https://mcp.cloudflare.com/mcp"

[mcp_servers.auth]
type = "oauth"
scopes = []

[[mcp_servers]]
name = "comfyui"
# Tailnet endpoint, per device: COMFYUI_MCP_URL in ~/.vibe/.env (from
# /opt/secrets/comfyui-mcp.url), so this shared config stays secret-free.
# vibe does not expand env vars in `url`, so bridge http -> stdio via mcp-remote.
# `-p node@22` shadows the system node 18 (current mcp-remote needs node >= 20).
transport = "stdio"
command = "bash"
args = [
    "-c",
    'export HOME="${HOME:-$(getent passwd "$(id -u)" | cut -d: -f6)}"; set -a; [ -f "$HOME/.vibe/.env" ] && source "$HOME/.vibe/.env"; set +a; exec npx -y -p node@22 -p mcp-remote mcp-remote "$COMFYUI_MCP_URL"',
]
tool_timeout_sec = 900
