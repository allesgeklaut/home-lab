theme = "dracula"
default_agent = "accept-edits"

# DeepSeek V4.1 Flash 1017, served on Mistral's API (same ID as OpenCode's
# mistral/deepseek-v4-1-flash-1017). Select it in-session with /model.
[[models]]
name = "deepseek-v4-1-flash-1017"
provider = "mistral"
alias = "deepseek-flash"
supports_images = true

# =====================================================================
# Ported from OpenCode (opencode.json in this repo).
# This file is version-controlled here and symlinked from
# ~/.vibe/config.toml — edit it in the repo, not in ~/.vibe/.
# Secrets are NEVER stored in this file. Add these to ~/.vibe/.env yourself:
#   LITELLM_KEY, GITHUB_TOKEN, TRILIUM_API_TOKEN, OPENAI_API_KEY
# =====================================================================

# Reuse the shared OpenCode skills in place (Agent Skills standard format)
skill_paths = ["/opt/stacks/.opencode/skills"]

# Local llama.cpp / LiteLLM server (was providers.llama-cpp in opencode.json)
[[providers]]
name = "llamacpp"
api_base = "http://192.168.0.46:4000/v1"
api_key_env_var = "LITELLM_KEY"

[[models]]
name = "qwen3.8-27b"
provider = "llamacpp"
alias = "qwen3.8-27b"
supports_images = true
thinking = "xhigh"

[[models]]
name = "qwen3.8-27b-abliterated"
provider = "llamacpp"
alias = "qwen3.8-27b-abliterated"
supports_images = true
thinking = "xhigh"

[[models]]
name = "bolt"
provider = "llamacpp"
alias = "bolt"
supports_images = true

# OpenAI provider (was providers.openai in opencode.json)
[[providers]]
name = "openai"
api_base = "https://api.openai.com/v1"
api_key_env_var = "OPENAI_API_KEY"

[[models]]
name = "gpt-6.1-sol"
provider = "openai"
alias = "gpt-6.1-sol"

[[models]]
name = "gpt-6-luna"
provider = "openai"
alias = "gpt-6-luna"

# Mistral-hosted models kept from the OpenCode setup
[[models]]
name = "mistral-small-latest"
provider = "mistral"
alias = "mistral-small"

[[models]]
name = "mistral-large-4"
provider = "mistral"
alias = "mistral-large-4"

[[models]]
name = "zai-glm-5-3"
provider = "mistral"
alias = "glm-5.3"

[[models]]
name = "zai-glm-5-3-flash"
provider = "mistral"
alias = "glm-5.3-flash"

# Session titles on the small model (was agents.title.model in opencode.json)
[utility_models]
title = "mistral-small"

# --- Guards ported from the opencode "permissions" list ---
# OpenCode's long shell "ask" list (rm, git push, docker ..., systemctl ...)
# is already Vibe's default for the shell (permission = "ask" below), so only
# the deny rules, sensitive files and outside-dir allows needed porting.

[tools.bash]
permission = "ask"
denylist = ["*--break-system-packages*"]
sensitive_file_patterns = ["*.env", "*.env.*", ".envrc", "*.pem", "*.key", "*credentials.json", "*credentials.yml", "*credentials.yaml", "*.credentials*"]
# opencode allowed external_directory /tmp/** and /opt/stacks/.playwright-out/**
allowlist = ["vibe-path:directory_recursive:/tmp", "vibe-path:directory_recursive:/opt/stacks/.playwright-out"]

[tools.read_file]
denylist = ["/opt/secrets/*", "/home/johannes/.ssh/*"]
sensitive_patterns = ["*.env", "*.env.*", ".envrc", "*.pem", "*.key", "*credentials.json", "*credentials.yml", "*credentials.yaml", "*.credentials*"]
allowlist = ["vibe-path:directory_recursive:/tmp", "vibe-path:directory_recursive:/opt/stacks/.playwright-out"]

[tools.edit]
denylist = ["/opt/secrets/*", "/home/johannes/.ssh/*"]

[tools.write_file]
denylist = ["/opt/secrets/*", "/home/johannes/.ssh/*"]

# --- MCP servers ported from the opencode "mcp" block ---

[[mcp_servers]]
name = "engram"
transport = "stdio"
command = "engram"
args = ["mcp", "--tools=agent"]

[[mcp_servers]]
name = "deep-research"
transport = "stdio"
command = "uvx"
args = ["--with", "fastmcp", "--with", "httpx", "python", "/opt/stacks/webui/mcpo/deep-research/deep_research_mcp_server.py"]
tool_timeout_sec = 300

[[mcp_servers]]
name = "github"
transport = "streamable-http"
url = "https://api.githubcopilot.com/mcp/"
[mcp_servers.auth]
type = "static"
api_key_env = "GITHUB_TOKEN"
api_key_header = "Authorization"
api_key_format = "Bearer {token}"

[[mcp_servers]]
name = "trilium"
transport = "stdio"
command = "npx"
args = ["-y", "triliumnext-mcp"]
tool_timeout_sec = 30
# TRILIUM_API_TOKEN is inherited from ~/.vibe/.env (add it there yourself)
env = { TRILIUM_API_URL = "http://192.168.0.46:9910/etapi" }

[[mcp_servers]]
name = "playwright"
transport = "stdio"
command = "docker"
args = ["run", "--rm", "-i", "--network", "host", "-v", "/opt/stacks:/opt/stacks:ro", "-v", "/opt/stacks/.playwright-out:/opt/stacks/.playwright-out", "mcr.microsoft.com/playwright/mcp:latest", "--headless", "--browser", "chromium", "--output-dir", "/opt/stacks/.playwright-out"]
tool_timeout_sec = 30

[[mcp_servers]]
name = "godot-ai"
transport = "stdio"
command = "/home/johannes/.local/bin/uvx"
args = ["--python", "3.12", "--isolated", "--no-config", "--no-env-file", "--no-sources", "--no-build", "--index-strategy", "first-index", "--keyring-provider", "disabled", "--index", "https://pypi.org/simple", "--default-index", "https://pypi.org/simple", "--find-links", "https://pypi.org/simple/godot-ai/", "--link-mode", "copy", "--from", "godot-ai==4.3.0", "godot-ai", "attach", "--port", "8000", "--ws-port", "9500"]
tool_timeout_sec = 120

[[mcp_servers]]
name = "cloudflare"
transport = "streamable-http"
url = "https://mcp.cloudflare.com/mcp"
[mcp_servers.auth]
type = "oauth"
scopes = []

# The real URL lives in /opt/secrets/comfyui-mcp.url — fill it in yourself and
# set disabled = false (or run: vibe mcp add comfyui --url "$(cat /opt/secrets/comfyui-mcp.url)")
[[mcp_servers]]
name = "comfyui"
transport = "streamable-http"
url = "https://REPLACE-WITH-COMFYUI-MCP-URL"
disabled = true
tool_timeout_sec = 900
