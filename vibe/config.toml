theme = "dracula"
default_agent = "smart-approve"
applied_migrations = [
    "bash_read_only_defaults_v1",
]
active_model = "mistral-large-4-0"

[[models]]
name = "mistral-large-4"
provider = "mistral"
alias = "mistral-large-4-medium"
thinking = "medium"
supports_images = true

[[models]]
name = "mistral-large-4"
provider = "mistral"
alias = "mistral-large-4-high"
thinking = "high"
supports_images = true

[[models]]
name = "zai-glm-5-3"
provider = "mistral"
alias = "glm-5.3-max"
thinking = "max"

[[models]]
name = "qwen3.8-27b"
provider = "llamacpp"
alias = "qwen3.8-27b"
thinking = "xhigh"
thinking_levels = ["off", "low", "medium", "xhigh"]
max_context_length = 135168
max_output_tokens = 8192
auto_compact_threshold = 111168
supports_images = true

[[models]]
name = "qwen3.8-27b"
provider = "llamacpp"
alias = "qwen-worker"
thinking = "xhigh"
thinking_levels = ["off", "low", "medium", "xhigh"]
max_context_length = 135168
max_output_tokens = 8192
auto_compact_threshold = 111168
supports_images = true

[[models]]
name = "qwen3.8-27b-abliterated"
provider = "llamacpp"
alias = "qwen3.8-27b-abliterated"
thinking = "xhigh"
thinking_levels = ["off", "low", "medium", "xhigh"]
max_context_length = 135168
max_output_tokens = 8192
auto_compact_threshold = 111168
supports_images = true

[[models]]
name = "bolt"
provider = "llamacpp"
alias = "bolt"
thinking = "on"
thinking_levels = ["off", "on"]
max_context_length = 131072
max_output_tokens = 8192
auto_compact_threshold = 107072
supports_images = true

[[providers]]
name = "llamacpp"
api_base = "http://192.168.0.46:4000/v1"
api_key_env_var = "LITELLM_KEY"

[[providers]]
name = "openai"
api_base = "https://api.openai.com/v1"
api_key_env_var = "OPENAI_API_KEY"

[tools.bash]
permission = "ask"
denylist = [
    "*--break-system-packages*",
    "git push",
]
sensitive_file_patterns = [
    "*.env",
    "*.env.*",
    ".envrc",
    "*.pem",
    "*.key",
    "*credentials.json",
    "*credentials.yml",
    "*credentials.yaml",
    "*.credentials*",
]
allowlist = [
    "basename",
    "cat",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "file",
    "find",
    "fmt",
    "fold",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "md5sum",
    "more",
    "nl",
    "od",
    "paste",
    "pwd",
    "readlink",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "uname",
    "uniq",
    "vibe-path:directory_recursive:/opt/stacks/.playwright-out",
    "vibe-path:directory_recursive:/tmp",
    "wc",
    "which",
]

[tools.read_file]
denylist = [
    "/opt/secrets/*",
    "*/.ssh/*",
]
sensitive_patterns = [
    "*.env",
    "*.env.*",
    ".envrc",
    "*.pem",
    "*.key",
    "*credentials.json",
    "*credentials.yml",
    "*credentials.yaml",
    "*.credentials*",
]
allowlist = [
    "vibe-path:directory_recursive:/tmp",
    "vibe-path:directory_recursive:/opt/stacks/.playwright-out",
]

[tools.edit]
denylist = [
    "/opt/secrets/*",
    "*/.ssh/*",
]

[tools.write_file]
denylist = [
    "/opt/secrets/*",
    "*/.ssh/*",
]

[[mcp_servers]]
name = "engram"
transport = "stdio"
command = "bash"
args = [
    "-c",
    "export HOME=\"${HOME:-$(getent passwd \"$(id -u)\" | cut -d: -f6)}\"; v=\"$(sed -n \"s/^ENGRAM_CLOUD_TOKEN=//p\" \"$HOME/.vibe/.env\")\"; v=\"${v%\\\"}\"; v=\"${v#\\\"}\"; export ENGRAM_CLOUD_TOKEN=\"$v\"; exec engram mcp --tools=agent",
]

[[mcp_servers]]
name = "deep-research"
transport = "stdio"
command = "bash"
args = [
    "-c",
    "export HOME=\"${HOME:-$(getent passwd \"$(id -u)\" | cut -d: -f6)}\"; unset MISTRAL_API_KEY; export MISTRAL_API_KEY_FILE=\"${MISTRAL_API_KEY_FILE:-/opt/secrets/mistral.env}\"; exec uvx --with fastmcp --with httpx python /opt/stacks/webui/mcpo/deep-research/deep_research_mcp_server.py",
]
tool_timeout_sec = 300

[[mcp_servers]]
name = "github"
transport = "streamable-http"
url = "https://api.githubcopilot.com/mcp/"

[mcp_servers.auth]
type = "static"
api_key_env = "GITHUB_TOKEN"
api_key_header = "Authorization"
api_key_format = "Bearer {token}"

[[mcp_servers]]
name = "trilium"
transport = "stdio"
command = "bash"
args = [
    "-c",
    "export HOME=\"${HOME:-$(getent passwd \"$(id -u)\" | cut -d: -f6)}\"; v=\"$(sed -n \"s/^TRILIUM_API_TOKEN=//p\" \"$HOME/.vibe/.env\")\"; v=\"${v%\\\"}\"; v=\"${v#\\\"}\"; export TRILIUM_API_TOKEN=\"$v\"; export TRILIUM_API_URL=\"http://192.168.0.46:9910/etapi\"; exec npx -y triliumnext-mcp",
]
tool_timeout_sec = 30

[[mcp_servers]]
name = "playwright"
transport = "stdio"
command = "docker"
args = [
    "run",
    "--rm",
    "-i",
    "--network",
    "host",
    "-v",
    "/opt/stacks:/opt/stacks:ro",
    "-v",
    "/opt/stacks/.playwright-out:/opt/stacks/.playwright-out",
    "mcr.microsoft.com/playwright/mcp:latest",
    "--headless",
    "--browser",
    "chromium",
    "--output-dir",
    "/opt/stacks/.playwright-out",
]
tool_timeout_sec = 30

[[mcp_servers]]
name = "godot-ai"
transport = "stdio"
command = "uvx"
args = [
    "--python",
    "3.12",
    "--isolated",
    "--no-config",
    "--no-env-file",
    "--no-sources",
    "--no-build",
    "--index-strategy",
    "first-index",
    "--keyring-provider",
    "disabled",
    "--index",
    "https://pypi.org/simple",
    "--default-index",
    "https://pypi.org/simple",
    "--find-links",
    "https://pypi.org/simple/godot-ai/",
    "--link-mode",
    "copy",
    "--from",
    "godot-ai==4.3.0",
    "godot-ai",
    "attach",
    "--port",
    "8000",
    "--ws-port",
    "9500",
]
tool_timeout_sec = 120

[[mcp_servers]]
name = "cloudflare"
transport = "streamable-http"
url = "https://mcp.cloudflare.com/mcp"

[mcp_servers.auth]
type = "oauth"
scopes = []

[[mcp_servers]]
name = "comfyui"
transport = "stdio"
command = "bash"
args = [
    "-c",
    "export HOME=\"${HOME:-$(getent passwd \"$(id -u)\" | cut -d: -f6)}\"; v=\"$(sed -n \"s/^COMFYUI_MCP_URL=//p\" \"$HOME/.vibe/.env\")\"; v=\"${v%\\\"}\"; v=\"${v#\\\"}\"; export COMFYUI_MCP_URL=\"$v\"; exec npx -y -p node@22 npx -y -p mcp-remote mcp-remote \"$COMFYUI_MCP_URL\"",
]
tool_timeout_sec = 900
